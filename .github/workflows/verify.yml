# The founding pipeline.  Decision record: docs/adr/0010-github-actions-and-check-run-collection.md
#
# It contains only what passes with no `src/` in the repository, on purpose.
# METHODOLOGY §261 — "the board cannot leave `red` until CI has recorded the acceptance
# test failing" — puts CI *before* slice 00 step 3, which is earlier than the code it will
# eventually check.  Everything that needs `src/` is at the foot of this file as a clearly
# marked PHASE 4 block: `npm run lint:arch` and `npm run graph:modules` fail today with
# "Can't open 'src' for reading", and a pipeline that is red by design teaches everyone to
# ignore it.
name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read only.  ADR-0010 Decision 2: `check.run` is *collected* from the API at each gate by
# tools/team-log/collect-ci.mjs, never committed from here — this repository's git history
# is itself under assessment (OC-7), and handing a workflow write access to the artifact
# being graded, in order to record that it was checked, is a poor trade.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # Deliberately NOT cancel-in-progress.  A superseded run can be the only record of a red
  # state (ADR-0010 Decision 3).  Runs here are cheap; evidence is not.
  cancel-in-progress: false

jobs:
  verify:
    name: docs, tools and log integrity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The append-only check diffs against the pull request's merge base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # §7.1's deployment runtime, not the maintainer's local Node 24: CI should agree
          # with what runs in production rather than with a laptop.  This literal and the
          # `engines` range in package.json are duplicated, but the duplication is checked
          # rather than silent — raise the floor above 22 and the next step fails.
          node-version: '22.x'
          cache: npm

      - name: install, with the engines pin enforced (TC-10)
        # TC-10 records that Node and npm are pinned; `engines` is advisory until something
        # enforces it, and this is that something.  Also asserts package-lock.json agrees
        # with package.json.
        run: npm ci --engine-strict

      # ── PHASE 4, wired in at slice 00a green commit 9 ────────────────────────────────
      # These two need `src/` and could not run before it existed.  They sit here, on the
      # existing job, rather than in a job of their own: they are cheap, they share this
      # job's install, and `red-proof` reads ONE conclusion for "install, typecheck and
      # lint all passed" (AC-6).  Splitting them would make that clause three conclusions
      # and the discriminator would have to be told about each.
      - name: typecheck
        # tsconfig.json includes BOTH src and tests, deliberately.  tsconfig.build.json
        # narrows to src, so `pretest`'s build can never see a type error in a test file —
        # which is exactly how one reached the red commit unnoticed (I-1, fixed in 46f0f53).
        # This step is what closes that gap, so it must not be narrowed to the build config.
        run: npm run typecheck

      - name: layering (QS-10)
        # `node tools/ci/lint-arch.mjs src tests`, NOT the bare `depcruise`.  The bare CLI
        # exits 0 having cruised nothing when it cannot resolve a compatible TypeScript
        # compiler, and `collect-ci.mjs` would then record `depcruise: "pass"` for a tree
        # the ruleset never looked at — criterion C4 reading a clean architecture from a
        # check that never ran.  The wrapper asserts coverage per root before it asserts
        # anything about violations.
        run: npm run lint:arch

      - name: system-design.md is current with its section files
        # METHODOLOGY §4, generated tier: the assembly cannot drift from its sources.
        run: npm run docs:check

      - name: tools regression suite
        run: npm run test:tools

      - name: the defect register is current with the log
        # Ruled at slice 00a: findings live in the event log and DEFECTS.md is
        # derived, so the register cannot drift from the record. Generated tier.
        run: npm run defects:check

      - name: every diagram is exported, and every diagram link resolves
        # METHODOLOGY §4: "an evaluator reading the repository on GitHub has no plugin
        # installed" — an un-exported diagram is invisible to the audience it was drawn for.
        # This is the honest subset of that section's claim: the skill's self_check.py and
        # verify-geometry.py live in a plugin cache outside the repository and cannot run
        # here.  See ADR-0010 Decision 4 and arc42 §11.
        shell: bash
        run: |
          fail=0
          for html in docs/diagrams/*.html; do
            [ -f "${html%.html}.svg" ] || {
              echo "::error file=$html::committed without its exported .svg"
              fail=1
            }
          done
          while IFS= read -r ref; do
            file=${ref%%:*}
            path=${ref#*:}
            [ -f "$(dirname "$file")/$path" ] || {
              echo "::error file=$file::diagram link does not resolve -> $path"
              fail=1
            }
          done < <(grep -roE '\]\([^)]*diagrams/[^)]+\)' docs --include='*.md' \
                   | sed -E 's/\]\(//; s/\)$//')
          [ "$fail" -eq 0 ] && echo "diagrams: exported and linked"
          exit $fail

      - name: the event log is append-only
        # METHODOLOGY §9.  Append-only is currently a property of the orchestrator's
        # discipline; here it becomes a property of the build.
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          log=docs/team-log/events.jsonl
          removed=$(git diff --unified=0 "$BASE_SHA...HEAD" -- "$log" | grep -c '^-[^-]' || true)
          if [ "${removed:-0}" -ne 0 ]; then
            echo "::error file=$log::$removed existing record(s) removed or altered — the log is append-only"
            git diff --unified=0 "$BASE_SHA...HEAD" -- "$log" | grep '^-[^-]' || true
            exit 1
          fi
          added=$(git diff --unified=0 "$BASE_SHA...HEAD" -- "$log" | grep -c '^+[^+]' || true)
          echo "append-only: ok (${added:-0} record(s) added, 0 removed)"

      - name: every event-log record validates against the schema
        # append.mjs validates on the write path, so this catches the one way round it:
        # a line edited by hand.
        #
        # This was ten lines of inline node until slice 01, with a comment saying it would
        # become a tools/ script "if this grows".  It did not grow; it was UNRUNNABLE
        # LOCALLY, which is worse.  The orchestrator appended five records with event names
        # the schema does not define, ran `npm test`, `npm run test:tools` and
        # `npm run lint:arch` — all green, because none of them validated the log — pushed,
        # and learned about it here.  A guard that only fires after the push costs a round
        # trip every time it earns its keep.  It is now `npm run log:check`, is in the
        # `test:tools` chain, and has its own cases in tools/test/log-check.test.mjs.
        run: npm run log:check

  # The criterion that decides what lives here rather than in the PHASE 4 block below is
  # "does it need `src/`", not "which phase does it belong to".  `npm test` does not need
  # `src/` — it needs a Docker daemon, which `ubuntu-latest` has.  It therefore lands in
  # slice 00a's RED COMMIT, authored by the test-engineer, and not three commits later.
  #
  # That is not tidiness.  CLAUDE.md §2.4 requires every slice's failing acceptance test to
  # be "observed red in CI", and METHODOLOGY.md:272 says the board cannot leave `red` until
  # CI has recorded it failing.  A red commit that creates a failure nobody can see has not
  # discharged its obligation, and the step-3 log entry — "the red commit SHA and the CI run
  # that observed it failing, with the failing assertion quoted" — could not be written
  # truthfully.  The step-1 design offered four substitute evidence items instead and called
  # the gap a bootstrap paradox; that was a workaround for a NON-NEGOTIABLE, and it was
  # ruled a design defect (docs/slices/00a-design.md §0, S-1).  This job is the fix.
  #
  # On the red commit the discrimination is two job conclusions a human can read: `verify`
  # green proves the branch is sound, `test` red proves the acceptance suite failed.  That
  # is exactly what the `red-proof` job automates from slice 00 onward.
  test:
    name: suite (Testcontainers)
    # ubuntu-latest ships a working Docker daemon (TC-9, ADR-0010), so no `services:` block
    # is needed and none is wanted: CLAUDE.md §2.2 forbids substituting the database, and
    # Testcontainers starts its own postgres:16 (arc42 §7.2).  No `needs:` and no
    # `continue-on-error` — this job's conclusion IS the observation.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: install, with the engines pin enforced (TC-10)
        run: npm ci --engine-strict

      - name: npm test
        # Both Vitest projects, `db` and `nodb`, in one invocation — so AC-1's
        # "npm ci && npm test" is satisfied literally and the run produces ONE
        # test-results.json, which is what tools/ci/red-proof.mjs's single --results input
        # can consume.
        run: npm test -- --reporter=json --outputFile=test-results.json

      - name: the failing assertions, as an artifact
        # if: always() because the interesting run is the one that failed.  90 days, so the
        # red run's own artifact is still there when red-proof.mjs is replayed against it at
        # the gate (docs/slices/00a-design.md §7, evidence item 3) and when
        # collect-ci.mjs backfills the `check.run` record that makes C1 measurable.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.json
          retention-days: 90
          if-no-files-found: warn

  # The last of the PHASE 4 block, wired in at slice 00a green commit 9.
  #
  # It runs only when the head commit subject matches ^test\(.+\): .*\(red\)$ — CLAUDE.md §7,
  # exactly one such commit per slice and authored by the test-engineer, so the marker cannot
  # be self-awarded by the implementer.  On every other commit it is *not applicable* and
  # exits 0 without asserting anything.
  #
  # It asserts the SHAPE of the failure rather than that there was one: at least one
  # test-engineer-owned suite failed, no test under tests/unit/ failed, and `verify`
  # concluded success.  A branch that does not compile fails `verify` and is therefore
  # reported as a broken run rather than a red proof — the discrimination ADR-0010
  # Decision 3 asks for.  The job SUCCEEDS when the required failure was observed, and the
  # check's name makes that inversion visible rather than hiding it in `continue-on-error`.
  #
  # The rule lives in tools/ci/red-proof.mjs with tools/test/red-proof.test.mjs in
  # `test:tools`, not in inline YAML — ADR-0010's Consequences anticipated exactly this, and
  # a decision this consequential should be executable offline against a downloaded artifact
  # (docs/slices/00a-design.md §7, evidence item 3).
  red-proof:
    name: red-proof
    needs: [verify, test]
    # always(): the interesting case is precisely the one where `test` FAILED, and a plain
    # `needs:` would skip this job then.
    if: always()
    runs-on: ubuntu-latest

    steps:
      # Its OWN checkout.  This is a new job on its own runner with its own workspace —
      # jobs do not inherit one — and `fetch-depth: 0` because `git log -1 <head.sha>`
      # fails on an object a shallow clone never fetched.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # No `npm ci`: red-proof.mjs imports nothing but node builtins.  That is a property
      # worth keeping — the discriminator must be runnable against an old artifact without
      # restoring that commit's dependency tree.

      - name: the head commit's subject
        # On a pull_request event the checked-out HEAD is GitHub's MERGE commit, whose
        # subject is "Merge <sha> into <sha>" and never matches the red pattern.  The
        # subject has to be read from the head commit explicitly.  A file rather than an
        # argument because a commit subject is arbitrary text and must not be re-quoted
        # through a shell.
        run: git log -1 --format=%s ${{ github.event.pull_request.head.sha || github.sha }} > subject.txt

      - name: the suite's results, from the test job
        uses: actions/download-artifact@v4
        with:
          name: test-results
        # If the `test` job never produced one, let red-proof.mjs report the missing input
        # itself (exit 2, naming the file) rather than failing here with a generic
        # artifact error.
        continue-on-error: true

      - name: red-proof
        run: |
          node tools/ci/red-proof.mjs \
            --subject-file subject.txt \
            --verify '${{ needs.verify.result }}' \
            --results test-results.json

# ---------------------------------------------------------------------------------------
# What is deliberately still not here.
#
#   check-run summary:        tools/team-log/collect-ci.mjs reads `gh run view --json` at
#               each gate and appends the `check.run` record with source "derived" via
#               appendRecords(..., { allowDerived: true }).  It needs no artifact from this
#               workflow: the API is the durable source, and the record in git plus the red
#               commit's SHA is the evidence.  The `test` job's test-results.json is
#               corroboration and expires at 90 days.
#
# Deliberately never here, with reasons in ADR-0010 Decision 4: Stryker (a reviewer's
# findings, not a threshold), `npm run log:audit` (its ground truth is subagent transcripts
# on the human's machine — on a fresh checkout it reports every honest run as UNSUPPORTED),
# and `npm run status` (regenerates a resume point that changes with every commit).
# ---------------------------------------------------------------------------------------
