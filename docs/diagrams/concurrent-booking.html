<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two racing bookings · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif',serif;
      --font-mono:'Geist Mono',ui-monospace,monospace}
    body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
    .frame{max-width:1100px;width:100%}
    .eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;
      text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem}
    h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;
      letter-spacing:-.02em;line-height:1.15;margin-bottom:.375rem}
    .subtitle{font-size:.8125rem;color:var(--color-muted);margin-bottom:1.5rem}
    svg{width:100%;min-width:900px;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · arc42 §6.1</p>
    <h1>Two racing bookings</h1>
    <p class="subtitle">Both requests are told the bay is free. The loser waits on the winner's advisory lock, so it conflicts with a committed row — which is what makes its 409 deterministic.</p>

    <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concurrent-booking-title concurrent-booking-desc">
      <title id="concurrent-booking-title">Two racing bookings</title>
      <desc id="concurrent-booking-desc">Sequence diagram of two simultaneous booking requests: both availability reads report the same bay and technician free, the first request takes transaction-scoped advisory locks on them and the second blocks waiting for those locks, the first inserts and commits, and the second is then granted the locks and its insert is rejected with SQLSTATE 23P01 naming the no_bay_overlap exclusion constraint against the now-committed row, so one caller receives 201 and the other 409.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(79,93,117,0.40)" stroke-width="1.2"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================================= LIFELINES ================================= -->
      <line x1="180" y1="104" x2="180" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="460" y1="104" x2="460" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="104" x2="800" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- =============================== ACTIVATION BARS =============================== -->
      <rect x="176" y="144" width="8" height="272" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="456" y="216" width="8" height="328" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="796" y="144" width="8" height="368" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ================================= MESSAGES ================================= -->

      <!-- m1 · R1 reads. Advisory, and answered before anything is locked. -->
      <line x1="184" y1="144" x2="792" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="616" y="124" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="133" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SELECT free bays</text>

      <line x1="792" y1="176" x2="188" y2="176" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="604" y="156" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="165" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">{B1}, {T1} · ADVISORY</text>

      <!-- m3/m4 · R2 gets the same answer, and it is already wrong for one of them. -->
      <line x1="464" y1="216" x2="792" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="616" y="196" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="205" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SELECT free bays</text>

      <line x1="792" y1="248" x2="468" y2="248" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="596" y="228" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="237" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">{B1}, {T1} · SAME ANSWER</text>

      <!-- m5 · R1 locks. ADR-0018: two class-scoped locks, inside the attempt's transaction. -->
      <line x1="184" y1="296" x2="792" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="584" y="264" width="152" height="24" rx="2" fill="#f5f5f5"/>
      <text x="660" y="274" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">BEGIN · pg_advisory_xact_lock</text>
      <text x="660" y="285" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">(1,B1), (2,T1) · GRANTED</text>

      <!-- m6 · R2 asks for the same lock and does not get it. -->
      <line x1="464" y1="336" x2="792" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="588" y="316" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="325" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">pg_advisory_xact_lock(1,B1)</text>

      <rect x="320" y="348" width="128" height="14" rx="2" fill="#f5f5f5"/>
      <text x="444" y="358" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">WAITS · R1 HOLDS (1,B1)</text>

      <!-- m7/m8 · The winner writes and commits. The lock is released by the commit. -->
      <line x1="184" y1="376" x2="792" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="588" y="356" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="365" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">INSERT B1, T1 [09:00,10:00)</text>

      <line x1="792" y1="408" x2="188" y2="408" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="596" y="388" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="397" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">COMMIT · LOCKS RELEASED</text>

      <!-- m9 · Only now is R2 let through, and the row it will meet is committed. -->
      <line x1="792" y1="440" x2="468" y2="440" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="604" y="420" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="429" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">(1,B1) GRANTED TO R2</text>

      <line x1="464" y1="480" x2="792" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="620" y="460" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="469" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">INSERT B1, T1</text>

      <!-- m11 · THE MOMENT. The one coral message, and the only decision in the diagram. -->
      <line x1="792" y1="512" x2="468" y2="512" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="596" y="480" width="128" height="24" rx="2" fill="#f5f5f5"/>
      <text x="660" y="490" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">23P01 no_bay_overlap</text>
      <text x="660" y="501" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">AGAINST A COMMITTED ROW</text>

      <!-- The §6.2 arm, in its degenerate case: one bay, so the list empties at once. -->
      <rect x="476" y="546" width="192" height="14" rx="2" fill="#f5f5f5"/>
      <text x="480" y="556" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">prune bay B1 → list empty → exhausted</text>

      <!-- ============================== THE BLOCKED SPAN ============================== -->
      <rect x="452" y="336" width="16" height="104" fill="url(#hatch)" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="4,3"/>

      <!-- ================================== ACTORS ================================== -->

      <rect x="80" y="40" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="40" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="88" y="48" width="56" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/>
      <text x="116" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REQUEST</text>
      <text x="180" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">R1 · wants 09:00</text>
      <text x="180" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /appointments</text>

      <rect x="360" y="40" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="40" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="368" y="48" width="56" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/>
      <text x="396" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REQUEST</text>
      <text x="460" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">R2 · wants 09:00</text>
      <text x="460" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /appointments</text>

      <rect x="696" y="40" width="208" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="696" y="40" width="208" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="704" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="718" y="57" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="800" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="800" y="93" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no_bay_overlap</text>

      <!-- ================================= OUTCOMES ================================= -->

      <rect x="80" y="584" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="584" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="606" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">201 Created</text>
      <text x="180" y="621" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">appointment a-1</text>

      <rect x="360" y="584" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="584" width="200" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="460" y="606" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">409 Conflict</text>
      <text x="460" y="621" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no-capacity · resource=bay</text>

      <!-- ============================== EDITORIAL ASIDE ============================== -->
      <text x="64" y="672" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">The lock reads no table and decides nothing. It only makes the loser wait for a committed row to conflict with.</text>

      <!-- ================================== LEGEND ================================== -->
      <line x1="64" y1="704" x2="936" y2="704" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="64" y="724" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="140" y1="720" x2="172" y2="720" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="180" y="724" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Statement</text>

      <line x1="272" y1="720" x2="304" y2="720" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="312" y="724" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Result</text>

      <line x1="388" y1="720" x2="420" y2="720" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4"/>
      <text x="428" y="724" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">23P01 — the only decision here</text>

      <rect x="656" y="712" width="32" height="16" fill="url(#hatch)" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="4,3"/>
      <text x="696" y="724" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Blocked on an advisory lock</text>
    </svg>
  </div>
</body>
</html>
