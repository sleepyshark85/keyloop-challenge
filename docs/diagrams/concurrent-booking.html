<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two racing bookings · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif',serif;
      --font-mono:'Geist Mono',ui-monospace,monospace}
    body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
    .frame{max-width:1100px;width:100%}
    .eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;
      text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem}
    h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;
      letter-spacing:-.02em;line-height:1.15;margin-bottom:.375rem}
    .subtitle{font-size:.8125rem;color:var(--color-muted);margin-bottom:1.5rem}
    svg{width:100%;min-width:900px;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · arc42 §6.1</p>
    <h1>Two racing bookings</h1>
    <p class="subtitle">Both advisors are told the bay is free. Only one write survives, and the application code is not what decides which.</p>

    <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concurrent-booking-title concurrent-booking-desc">
      <title id="concurrent-booking-title">Two racing bookings</title>
      <desc id="concurrent-booking-desc">Sequence diagram in which two service advisors request the same appointment slot simultaneously: both availability reads report the bay free, both inserts are attempted, PostgreSQL commits the first and rejects the second with SQLSTATE 23P01 naming the no_bay_overlap exclusion constraint, and the scheduler returns 201 to one advisor and 409 to the other.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================================= LIFELINES ================================= -->
      <line x1="140" y1="104" x2="140" y2="536" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="340" y1="104" x2="340" y2="536" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="580" y1="104" x2="580" y2="536" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="840" y1="104" x2="840" y2="536" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- =============================== ACTIVATION BARS =============================== -->
      <rect x="576" y="140" width="8" height="380" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="836" y="220" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="836" y="300" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="836" y="380" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ================================= MESSAGES ================================= -->

      <!-- m1 · A → Scheduler -->
      <line x1="140" y1="140" x2="572" y2="140" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="412" y="120" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="460" y="129" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POST /appointments</text>

      <!-- m2 · B → Scheduler -->
      <line x1="340" y1="176" x2="572" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="412" y="156" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="460" y="165" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POST /appointments</text>

      <!-- m3 · Scheduler → PG : the advisory read, made for both -->
      <line x1="584" y1="220" x2="832" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="666" y="200" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="710" y="209" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SELECT free bays</text>

      <!-- m4 · return -->
      <line x1="836" y1="252" x2="588" y2="252" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="654" y="232" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="710" y="241" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">{B1}, {T1} · ADVISORY</text>

      <!-- m5 · Scheduler → PG : insert for A -->
      <line x1="584" y1="300" x2="832" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="662" y="280" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="710" y="289" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">INSERT · request A</text>

      <!-- m6 · return -->
      <line x1="836" y1="332" x2="588" y2="332" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="686" y="312" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="710" y="321" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">COMMIT</text>

      <!-- m7 · Scheduler → PG : insert for B, same bay, same interval -->
      <line x1="584" y1="380" x2="832" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="662" y="360" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="710" y="369" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">INSERT · request B</text>

      <!-- m8 · THE MOMENT. The one coral message. -->
      <line x1="836" y1="412" x2="588" y2="412" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="656" y="392" width="108" height="12" rx="2" fill="#f5f5f5"/>
      <text x="710" y="401" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">23P01 no_bay_overlap</text>

      <!-- m9 · Scheduler → A -->
      <line x1="576" y1="468" x2="144" y2="468" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="428" y="448" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="460" y="457" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">201 Created</text>

      <!-- m10 · Scheduler → B -->
      <line x1="576" y1="504" x2="344" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="426" y="484" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="460" y="493" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">409 Conflict</text>

      <!-- ================================== ACTORS ================================== -->

      <rect x="60" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="40" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="68" y="48" width="40" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/>
      <text x="88" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
      <text x="140" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Advisor A</text>
      <text x="140" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">wants 09:00</text>

      <rect x="260" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="40" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="268" y="48" width="40" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/>
      <text x="288" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
      <text x="340" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Advisor B</text>
      <text x="340" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">wants 09:00</text>

      <rect x="488" y="40" width="184" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="488" y="40" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="496" y="48" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="520" y="57" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVICE</text>
      <text x="580" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scheduler</text>
      <text x="580" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">src/application</text>

      <rect x="744" y="40" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="40" width="192" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="752" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="766" y="57" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="840" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="840" y="93" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no_bay_overlap</text>

      <!-- ============================== EDITORIAL ASIDE ============================== -->
      <text x="64" y="576" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">There is no window between the check and the act, because nothing acts on the check.</text>

      <!-- ================================== LEGEND ================================== -->
      <line x1="64" y1="616" x2="936" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="64" y="636" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="140" y1="632" x2="172" y2="632" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="180" y="636" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Inbound HTTP call</text>

      <line x1="308" y1="632" x2="340" y2="632" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="348" y="636" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Return</text>

      <line x1="420" y1="632" x2="452" y2="632" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4"/>
      <text x="460" y="636" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Exclusion violation — the only place the race is decided</text>
    </svg>
  </div>
</body>
</html>
