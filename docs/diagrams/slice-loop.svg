<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slice-loop-title slice-loop-desc">
      <title id="slice-loop-title">The slice loop</title>
      <desc id="slice-loop-desc">Flowchart of seven sequential steps for one unit of work — design, agree, red, green, review, human gate, as-built reconciliation — with a return path from review back to design taken only when the architect rules a design defect.</desc>

      <defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ARROWS FIRST (z-order puts them behind boxes) ============ -->
      <!-- sequential: straight verticals, endpoints share x -->
      <line x1="500" y1="128" x2="500" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="216" x2="500" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="304" x2="500" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="392" x2="500" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="480" x2="500" y2="508" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="568" x2="500" y2="596" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- LOOPBACK · coral · rounded right-angle elbows, r=8 -->
      <path d="M 340 452 L 208 452 A 8 8 0 0 1 200 444 L 200 108 A 8 8 0 0 1 208 100 L 340 100"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- loopback label: beside the vertical segment, 8px clear of the stroke -->
      <rect x="208" y="264" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="264" y="273" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">(C) DESIGN DEFECT</text>

      <!-- ============ STEP BOXES ============ -->
      <!-- 1 DESIGN -->
      <rect x="340" y="72" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="72" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="352" y="80" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="362" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <text x="500" y="106" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Design</text>
      <text x="500" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">arc42 delta · ADR draft · QS-*</text>
      <text x="680" y="104" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">architect</text>

      <!-- 2 AGREE -->
      <rect x="340" y="160" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="160" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="352" y="168" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="362" y="177" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
      <text x="500" y="194" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agree</text>
      <text x="500" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agreed, or objections</text>
      <text x="680" y="186" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">test-engineer</text>
      <text x="680" y="200" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">+ implementer</text>

      <!-- 3 RED -->
      <rect x="340" y="248" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="248" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="352" y="256" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="362" y="265" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>
      <text x="500" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Red</text>
      <text x="500" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">acceptance test committed failing</text>
      <text x="680" y="274" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">test-engineer</text>

      <!-- 4 GREEN -->
      <rect x="340" y="336" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="336" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="352" y="344" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="362" y="353" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">4</text>
      <text x="500" y="370" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Green</text>
      <text x="500" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unit TDD · small green commits</text>
      <text x="680" y="362" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">implementer</text>

      <!-- 5 REVIEW -->
      <rect x="340" y="424" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="424" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="352" y="432" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="362" y="441" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">5</text>
      <text x="500" y="458" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Review</text>
      <text x="500" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">findings · layering · mutants</text>
      <text x="680" y="450" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">reviewer</text>

      <!-- 6 GATE · FOCAL -->
      <rect x="340" y="512" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="512" width="320" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="352" y="520" width="20" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="362" y="529" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">6</text>
      <text x="500" y="546" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gate</text>
      <text x="500" y="560" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">exploratory testing, then merge</text>
      <text x="680" y="538" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace">human</text>

      <!-- 7 AS-BUILT -->
      <rect x="340" y="600" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="600" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="352" y="608" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="362" y="617" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">7</text>
      <text x="500" y="634" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">As-built</text>
      <text x="500" y="648" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">arc42 reconciled to what merged</text>
      <text x="680" y="626" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">architect</text>

      <!-- ============ EDITORIAL CALLOUT ============ -->
      <text x="976" y="44" fill="#2d3142" font-size="14" font-style="italic"
            font-family="'Instrument Serif', serif" text-anchor="end">any step may raise a DCR</text>
      <path d="M 800 52 Q 700 60 664 92" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="664" cy="92" r="2" fill="#2d3142"/>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="700" x2="960" y2="700" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="716" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="736" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="744" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Human decision</text>

      <rect x="200" y="736" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="744" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Agent step</text>

      <line x1="340" y1="742" x2="368" y2="742" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="376" y="744" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sequence</text>

      <line x1="500" y1="742" x2="528" y2="742" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="536" y="744" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Loopback — max 2 per slice, then escalate</text>
    </svg>
