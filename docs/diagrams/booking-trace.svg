<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="booking-trace-title booking-trace-desc">
      <title id="booking-trace-title">The window, made visible</title>
      <desc id="booking-trace-desc">Trace waterfall of one contended booking request. A root span for POST /appointments encloses an availability.candidates span carrying candidate counts, then a shaded gap, then three separate appointment.insert spans — one per attempt. The first two are refused with SQLSTATE 23P01 naming the no_bay_overlap and no_technician_overlap constraints; the third commits and the request returns 201. The gap between the availability span and the first insert is the interval a check-then-act implementation would have raced in, and nothing after it reads the availability answer.</desc>

      <defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="bt-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <pattern id="bt-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(79,93,117,0.22)" stroke-width="1.2"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================================ THE WINDOW ================================ -->
      <rect x="508" y="172" width="76" height="220" fill="url(#bt-hatch)"/>
      <line x1="508" y1="168" x2="508" y2="400" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="584" y1="168" x2="584" y2="400" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- ================================= TIME AXIS ================================= -->
      <text x="300" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0 ms</text>
      <text x="448" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">10</text>
      <text x="596" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">20</text>
      <text x="744" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">30</text>
      <text x="892" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">40</text>
      <line x1="300" y1="112" x2="892" y2="112" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>

      <!-- ============================= NESTING GUIDE ============================= -->
      <line x1="56" y1="156" x2="56" y2="368" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="2,3"/>
      <line x1="56" y1="198" x2="62" y2="198" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <line x1="56" y1="254" x2="62" y2="254" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <line x1="56" y1="310" x2="62" y2="310" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <line x1="56" y1="366" x2="62" y2="366" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

      <!-- ================================== ROW A ================================== -->
      <text x="48" y="142" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">POST /appointments</text>
      <text x="48" y="156" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">root span · hand-written</text>
      <rect x="300" y="128" width="592" height="28" rx="4" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1.2"/>
      <text x="312" y="146" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">40 ms</text>
      <text x="912" y="146" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">http.method=POST · http.status_code=201</text>

      <!-- ================================== ROW B ================================== -->
      <text x="68" y="198" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">availability.candidates</text>
      <text x="68" y="212" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">advisory — UX, not correctness</text>
      <rect x="316" y="184" width="192" height="28" rx="4" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="328" y="202" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">13 ms</text>
      <text x="912" y="202" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">candidates.bays=3 · candidates.technicians=2</text>

      <!-- ================================== ROW C ================================== -->
      <text x="68" y="254" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">appointment.insert</text>
      <text x="68" y="268" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">booking.attempt=1</text>
      <rect x="584" y="240" width="72" height="28" rx="4" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="596" y="258" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace">5 ms</text>
      <text x="912" y="258" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace">db.sqlstate=23P01 · no_bay_overlap</text>

      <!-- ================================== ROW D ================================== -->
      <text x="68" y="310" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">appointment.insert</text>
      <text x="68" y="324" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">booking.attempt=2</text>
      <rect x="664" y="296" width="64" height="28" rx="4" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="676" y="314" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace">4 ms</text>
      <text x="912" y="314" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace">db.sqlstate=23P01 · no_technician_overlap</text>

      <!-- ================================== ROW E ================================== -->
      <text x="68" y="366" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">appointment.insert</text>
      <text x="68" y="380" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">booking.attempt=3</text>
      <rect x="736" y="352" width="96" height="28" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="748" y="370" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">6 ms · committed</text>
      <text x="912" y="370" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">bay.id=b-3 · technician.id=t-2</text>

      <!-- ================================ CALLOUTS ================================ -->
      <text x="48" y="452" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">The window check-then-act would have raced in — and nothing reads it.</text>
      <path d="M 420 436 Q 500 424 544 404" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="546" cy="402" r="2" fill="#2d3142"/>

      <text x="1152" y="452" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">One span per attempt, so a retry is three bars and not one long one.</text>
      <path d="M 880 436 Q 840 414 800 388" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="798" cy="386" r="2" fill="#2d3142"/>

      <!-- ================================= LEGEND ================================= -->
      <line x1="48" y1="496" x2="1152" y2="496" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="48" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="48" y="524" width="24" height="10" rx="2" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="80" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Span</text>

      <rect x="192" y="524" width="24" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="224" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Committed insert</text>

      <rect x="384" y="524" width="24" height="10" rx="2" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="416" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Attempt refused — SQLSTATE 23P01</text>

      <rect x="640" y="524" width="24" height="10" fill="url(#bt-hatch)" stroke="rgba(45,49,66,0.35)" stroke-width="0.8" stroke-dasharray="3,2"/>
      <text x="672" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">The window nothing depends on</text>
    </svg>
