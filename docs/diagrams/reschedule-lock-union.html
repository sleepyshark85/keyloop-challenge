<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rescheduling · The lock union</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif',serif;
      --font-mono:'Geist Mono',ui-monospace,monospace}
    body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
    .frame{max-width:1100px;width:100%}
    .eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;
      text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem}
    h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;
      letter-spacing:-.02em;line-height:1.15;margin-bottom:.375rem}
    .subtitle{font-size:.8125rem;color:var(--color-muted);margin-bottom:1.5rem}
    svg{width:100%;min-width:900px;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Ordered write · arc42 §6.3</p>
    <h1>Rescheduling — one atomic UPDATE</h1>
    <p class="subtitle">A move is in flight against two pairs, not one: the pair it leaves stays live until commit. So it locks the union of both, in one order, and writes once.</p>

    <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reschedule-lock-union-title reschedule-lock-union-desc">
      <title id="reschedule-lock-union-title">Rescheduling and the lock union</title>
      <desc id="reschedule-lock-union-desc">The reschedule path in four ordered steps within one transaction: read the appointment row, take the row's own lock, take advisory locks over the union of the pair being left and the pair being taken in a total order given by lock class and key hash, then issue one guarded UPDATE. Its verdicts are one row updated, zero rows meaning the appointment is not confirmed, an exclusion violation returning to the retry arm, and a deadlock treated as an internal fault. A side panel explains that the vacated index entry stays live until commit, and an inset shows that a move onto an interval overlapping its own succeeds because the new row version is checked against other rows only.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================================ CONNECTORS ================================ -->
      <line x1="124" y1="120" x2="124" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="136" y="128" width="232" height="14" rx="2" fill="#f5f5f5"/>
      <text x="140" y="138" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">the row exists — 404 is already ruled out</text>

      <line x1="124" y1="232" x2="124" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="136" y="240" width="248" height="14" rx="2" fill="#f5f5f5"/>
      <text x="140" y="250" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">the pair it leaves is now known and pinned</text>

      <line x1="124" y1="344" x2="124" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="136" y="352" width="216" height="14" rx="2" fill="#f5f5f5"/>
      <text x="140" y="362" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">both pairs held, in one order</text>

      <line x1="124" y1="456" x2="124" y2="492" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="136" y="464" width="216" height="14" rx="2" fill="#f5f5f5"/>
      <text x="140" y="474" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">one statement, one verdict</text>

      <!-- ================================== STEP 1 ================================== -->
      <rect x="64" y="48" width="520" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="48" width="520" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="58" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="98" y="67" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ</text>
      <text x="572" y="67" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">once, before the loop</text>
      <text x="76" y="92" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">SELECT … FROM appointment WHERE id = $1</text>
      <text x="76" y="110" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">0 rows → 404 — the read the move cannot be built without · yields B1, T1 at 09:00</text>

      <!-- ================================== STEP 2 ================================== -->
      <rect x="64" y="160" width="520" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="160" width="520" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="170" width="72" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="108" y="179" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROW LOCK</text>
      <text x="572" y="179" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">inside this attempt's transaction</text>
      <text x="76" y="204" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">the row's own lock</text>
      <text x="76" y="222" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">the pair it leaves is re-read under it, so the lock set is computed from the row as it is now</text>

      <!-- ================================== STEP 3 ================================== -->
      <rect x="64" y="272" width="520" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="272" width="520" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="282" width="112" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="128" y="291" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADVISORY LOCKS</text>
      <text x="572" y="291" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">the union, not the destination</text>
      <text x="76" y="316" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">(1,B1) (1,B2) (2,T1) (2,T2)</text>
      <text x="76" y="334" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">ordered by (class, hashtext(key)) — a total order no path can reverse</text>

      <!-- ================================== STEP 4 ================================== -->
      <rect x="64" y="384" width="520" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="384" width="520" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="394" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="102" y="403" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITE</text>
      <text x="572" y="403" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">no pre-read of the target slot</text>
      <text x="76" y="428" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">UPDATE appointment SET bay_id, technician_id, starts_at, ends_at</text>
      <text x="76" y="446" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">WHERE id = $1 AND status = 'confirmed' — and no id &lt;&gt; $1 predicate anywhere</text>

      <!-- ================================= VERDICTS ================================= -->
      <rect x="64" y="496" width="520" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="496" width="520" height="128" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="72" y="506" width="64" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="104" y="515" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERDICTS</text>
      <text x="80" y="540" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">1 row   → 200 OK · the id survives, because it is an UPDATE</text>
      <text x="80" y="564" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">0 rows  → 409 not confirmed · existence was settled by the read</text>
      <text x="80" y="588" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace">23P01   → the §6.2 arm: prune, then the next candidate</text>
      <text x="80" y="612" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">40P01   → 500 · a path locked less than it wrote (ADR-0030)</text>

      <!-- ============================ TWO PAIRS, ONE UNION ============================ -->
      <rect x="632" y="48" width="304" height="296" rx="6" fill="#f5f5f5"/>
      <rect x="632" y="48" width="304" height="296" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="640" y="58" width="48" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="664" y="67" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UNION</text>
      <text x="784" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">In flight against two pairs</text>
      <line x1="648" y1="112" x2="920" y2="112" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="648" y="136" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">leaves · B1, T1 · 09:00-10:00</text>
      <text x="648" y="156" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">takes  · B2, T2 · 11:00-12:00</text>
      <line x1="648" y1="172" x2="920" y2="172" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="648" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">the vacated index entry stays live until</text>
      <text x="648" y="206" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">COMMIT, so the move waits and is waited on</text>
      <text x="648" y="228" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">it therefore locks the UNION of both pairs,</text>
      <text x="648" y="242" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">never only the pair it takes (ADR-0030)</text>
      <line x1="648" y1="258" x2="920" y2="258" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="648" y="280" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">row lock → advisory locks → write</text>
      <text x="648" y="300" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">one order on every write path, and a lock</text>
      <text x="648" y="314" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">set that covers every tuple this statement</text>
      <text x="648" y="328" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">waits on — together, no cycle</text>

      <!-- ================================ QS-6 INSET ================================ -->
      <rect x="632" y="384" width="304" height="240" rx="6" fill="#f5f5f5"/>
      <rect x="632" y="384" width="304" height="240" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="640" y="394" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="660" y="403" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QS-6</text>
      <text x="784" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A move onto its own interval</text>

      <rect x="720" y="466" width="64" height="56" rx="2" fill="rgba(235,108,54,0.10)"/>
      <text x="656" y="464" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">old · 09:00-10:00</text>
      <rect x="656" y="470" width="128" height="20" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="720" y="498" width="128" height="20" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="720" y="534" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">new · 09:30-10:30</text>

      <text x="648" y="562" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">the two overlap, and the move still succeeds:</text>
      <text x="648" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PostgreSQL checks the NEW row version against</text>
      <text x="648" y="590" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">OTHER rows, and its own old version is not one</text>
      <text x="648" y="612" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">200 OK · same id, new interval</text>

      <!-- ============================== EDITORIAL ASIDE ============================== -->
      <text x="64" y="672" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Before this rule, 11.7 % of contended moves deadlocked. After it, none in a thousand.</text>

      <!-- ================================== LEGEND ================================== -->
      <line x1="64" y1="704" x2="936" y2="704" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="64" y="724" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="140" y1="720" x2="172" y2="720" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="180" y="724" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Order within one transaction</text>

      <rect x="380" y="712" width="32" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="724" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Step</text>

      <rect x="480" y="712" width="32" height="16" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="520" y="724" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Annotation, not a step</text>

      <rect x="700" y="712" width="32" height="16" rx="2" fill="rgba(235,108,54,0.10)"/>
      <text x="740" y="724" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">The overlap QS-6 is about</text>
    </svg>
  </div>
</body>
</html>
