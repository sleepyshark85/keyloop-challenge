<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="660" viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deployment-title deployment-desc">
      <title id="deployment-title">Three pieces on one machine</title>
      <desc id="deployment-desc">Deployment view of the appointment scheduler on a single machine: docker compose starts postgres:16 and the otel-lgtm collector, while the scheduler itself runs on the host under npm start; the caller reaches it on port 3000 over loopback only, PostgreSQL is the correctness boundary because of its btree_gist requirement, and the telemetry collector is reached over an optional path whose absence must not break the service.</desc>

      <defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============================== ZONES (drawn first) ============================== -->

      <!-- The trust boundary. Nothing enforces it but the network. -->
      <rect x="48" y="104" width="904" height="456" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="64" y="98" width="344" height="12" rx="2" fill="#f5f5f5"/>
      <text x="72" y="107" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ONE MACHINE · LOOPBACK ONLY · NO GATEWAY · NO TLS · NO AUTH</text>

      <!-- The host. The service is here and nowhere else. -->
      <rect x="64" y="232" width="440" height="216" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="80" y="226" width="132" height="12" rx="2" fill="#f5f5f5"/>
      <text x="88" y="235" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HOST · npm start</text>

      <!-- Compose. Dependencies only — docker-compose.yml says so in its own header. -->
      <rect x="568" y="232" width="360" height="296" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="584" y="226" width="248" height="12" rx="2" fill="#f5f5f5"/>
      <text x="592" y="235" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">docker compose up -d · DEPENDENCIES ONLY</text>

      <!-- ============================ PATHS (behind the boxes) ============================ -->

      <!-- caller → scheduler : shared x, plain line. Crosses into the host zone. -->
      <line x1="360" y1="200" x2="360" y2="292" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="372" y="250" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="376" y="259" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTP :3000</text>

      <!-- scheduler → postgres : shared y, plain line. The one path the service cannot lose. -->
      <line x1="472" y1="332" x2="596" y2="332" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="504" y="312" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="536" y="321" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQL :5432</text>

      <!-- scheduler → otel-lgtm : down out of the host, then right. Dashed: optional at runtime. -->
      <path d="M 400,408 V 456 Q 400,464 408,464 H 596" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="456" y="444" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="494" y="453" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OTLP :4317</text>

      <!-- ==================================== NODES ==================================== -->

      <!-- Caller — stubbed, and on the same machine because nothing else may reach :3000 -->
      <rect x="248" y="136" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="136" width="224" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="256" y="142" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="274" y="151" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STUB</text>
      <text x="360" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stubbed client</text>
      <text x="360" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cURL harness · OpenAPI</text>

      <!-- Scheduler — on the host, deliberately not in compose -->
      <rect x="96" y="296" width="376" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="96" y="296" width="376" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="104" y="304" width="88" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="148" y="313" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST PROCESS</text>
      <rect x="380" y="304" width="84" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="422" y="313" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATELESS ×1</text>
      <text x="284" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">scheduler</text>
      <text x="284" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one process, no clustering — nothing to coordinate</text>
      <rect x="112" y="368" width="344" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="124" y="383" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">dist/main.js</text>
      <text x="444" y="383" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">node 22 LTS</text>

      <!-- PostgreSQL — the correctness boundary. Heavier stroke, white fill, two artifacts. -->
      <rect x="600" y="264" width="304" height="136" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="264" width="304" height="136" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.6"/>
      <rect x="608" y="272" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="640" y="281" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONTAINER</text>
      <text x="752" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">postgres</text>
      <text x="752" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the correctness boundary, not a storage detail</text>
      <rect x="616" y="332" width="272" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="628" y="347" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">postgres:16</text>
      <text x="876" y="347" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">:5432</text>
      <rect x="616" y="364" width="272" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="628" y="379" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">btree_gist</text>
      <text x="876" y="379" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">TC-3 · no managed offering</text>

      <!-- otel-lgtm — dashed throughout: delete this box and the system still works -->
      <rect x="600" y="416" width="304" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="416" width="304" height="96" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="608" y="424" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="638" y="433" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPTIONAL</text>
      <text x="752" y="450" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">otel-lgtm</text>
      <text x="752" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">may be absent · failures logged and dropped</text>
      <rect x="616" y="476" width="272" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="628" y="491" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">grafana/otel-lgtm</text>
      <text x="876" y="491" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Grafana UI :3001</text>

      <!-- ================================== CALLOUT ================================== -->
      <text x="928" y="84" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">the deployment is what makes the missing authentication acceptable</text>
      <path d="M 704,92 Q 732,96 758,103" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="760" cy="104" r="2" fill="#2d3142"/>

      <!-- ================================== LEGEND ================================== -->
      <line x1="48" y1="588" x2="952" y2="588" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="48" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="124" y="600" width="12" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="144" y="609" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Zone — a real boundary, not visual grouping</text>

      <line x1="400" y1="606" x2="432" y2="606" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="440" y="609" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Network path</text>

      <line x1="548" y1="606" x2="580" y2="606" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="588" y="609" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Optional · absence must not break the service</text>

      <text x="48" y="636" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NOTHING ENFORCES THE BOUNDARY BUT THE NETWORK — GC-2 REMOVED AUTHENTICATION, AND §11.3 CARRIES THE RETROFIT</text>
    </svg>
