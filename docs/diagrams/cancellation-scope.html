<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancellation · Leaving the constraint's scope</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif',serif;
      --font-mono:'Geist Mono',ui-monospace,monospace}
    body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
    .frame{max-width:1100px;width:100%}
    .eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;
      text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem}
    h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;
      letter-spacing:-.02em;line-height:1.15;margin-bottom:.375rem}
    .subtitle{font-size:.8125rem;color:var(--color-muted);margin-bottom:1.5rem}
    svg{width:100%;min-width:900px;display:block}
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Scope · arc42 §6.4</p>
    <h1>Cancellation — the row leaves the constraint's scope</h1>
    <p class="subtitle">One unconditional statement, no guard and no lock. The slot becomes bookable again because the row stops satisfying the constraints' predicate — not because anything released it.</p>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cancellation-scope-title cancellation-scope-desc">
      <title id="cancellation-scope-title">Cancellation and the constraint's scope</title>
      <desc id="cancellation-scope-desc">A dashed region represents the scope of the exclusion constraints, defined by their predicate on rows that are not cancelled. Three confirmed appointments sit inside it. One unconditional update sets a row's status to cancelled, which moves that row out of the region: it is still a row, but no longer a peer for the overlap check, so its slot becomes bookable again through the same mechanism that guards every other write, with no compensating release and no bookkeeping.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- =============================== THE SCOPE =============================== -->
      <rect x="64" y="64" width="440" height="280" rx="8" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="76" y="76" width="136" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="144" y="85" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONSTRAINT SCOPE</text>
      <text x="76" y="110" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace">WHERE (status &lt;&gt; 'cancelled')</text>

      <!-- ============================== THE STATEMENT ============================== -->
      <line x1="380" y1="220" x2="736" y2="220" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="542" y="196" width="160" height="14" rx="2" fill="#f5f5f5"/>
      <text x="622" y="206" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SET status = 'cancelled'</text>

      <!-- ============================== CONFIRMED ROWS ============================== -->
      <rect x="96" y="136" width="280" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="112" y="158" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">a-1 · bay B1 · 09:00-10:00</text>
      <text x="112" y="174" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">confirmed — a peer for every overlap check</text>

      <rect x="96" y="196" width="280" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="112" y="218" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">a-2 · bay B1 · 11:00-12:00</text>
      <text x="112" y="234" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">confirmed — and about to be cancelled</text>

      <rect x="96" y="256" width="280" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="112" y="278" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">a-3 · bay B2 · 09:00-10:00</text>
      <text x="112" y="294" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">confirmed — untouched by any of this</text>

      <!-- ============================== THE CANCELLED ROW ============================== -->
      <rect x="744" y="196" width="192" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="196" width="192" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="760" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">a-2 · cancelled</text>
      <text x="760" y="234" fill="#9aa1b1" font-size="8" font-family="'Geist Mono', monospace">still a row · no longer a peer</text>

      <!-- ================================ CONSEQUENCE ================================ -->
      <rect x="64" y="376" width="872" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="376" width="872" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="72" y="386" width="88" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="116" y="395" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONSEQUENCE</text>
      <text x="80" y="418" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">11:00 in bay B1 is bookable again — by the mechanism that guards every other write, with nothing released and nothing restored</text>
      <text x="80" y="438" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">no guard, no pre-read and no advisory lock: a cancelled row satisfies no constraint's WHERE, so there is nothing left to serialise</text>

      <!-- ============================== EDITORIAL ASIDE ============================== -->
      <text x="64" y="488" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Nothing frees the slot. The row simply stops being something the constraint can see.</text>

      <!-- ================================== LEGEND ================================== -->
      <line x1="64" y1="512" x2="936" y2="512" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="64" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="140" y="520" width="32" height="16" rx="4" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="180" y="532" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">The constraints' scope</text>

      <rect x="340" y="520" width="32" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="532" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Confirmed — inside it</text>

      <rect x="520" y="520" width="32" height="16" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="560" y="532" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Cancelled — outside it</text>

      <line x1="700" y1="528" x2="732" y2="528" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="740" y="532" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">The one statement</text>
    </svg>
  </div>
</body>
</html>
