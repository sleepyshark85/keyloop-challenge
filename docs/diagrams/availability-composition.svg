<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="720" viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="availability-composition-title availability-composition-desc">
      <title id="availability-composition-title">Availability as a set difference</title>
      <desc id="availability-composition-desc">The availability query composed from two independent reads: candidate resources from reference data, which cannot reach the appointment table at all, minus the resources busy in the queried window. The application subtracts one from the other, takes no lock and reserves nothing, so the answer may be stale before it is serialised. A panel below shows the same overlap predicate written twice — once in the busy-resources query and once in the exclusion constraint — held equal by a quality scenario rather than by anything structural.</desc>

      <defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================================ CONNECTORS ================================ -->
      <path d="M248,136 V164 Q248,172 256,172 H344 Q352,172 352,180 V208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="256" y="152" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="161" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">bays × technicians</text>

      <path d="M752,136 V164 Q752,172 744,172 H656 Q648,172 648,180 V208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="656" y="152" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="700" y="161" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">busy in [from, to)</text>

      <line x1="500" y1="296" x2="500" y2="348" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="516" y="314" width="216" height="14" rx="2" fill="#f5f5f5"/>
      <text x="520" y="324" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">ADVISORY · NO LOCK · RESERVES NOTHING</text>

      <!-- ================================ THE TWO READS ================================ -->
      <rect x="64" y="48" width="368" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="48" width="368" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="72" y="58" width="72" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="108" y="67" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REFERENCE</text>
      <text x="248" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">candidateRepository</text>
      <text x="76" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">candidateResources(dealership, serviceType)</text>
      <text x="76" y="126" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">cannot see the appointment table at all — it reads no booking</text>

      <rect x="568" y="48" width="368" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="48" width="368" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="576" y="58" width="60" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="606" y="67" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WINDOW</text>
      <text x="752" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">appointmentRepository</text>
      <text x="580" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">busyResources(dealership, serviceType, from, to)</text>
      <text x="580" y="126" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">exactly the window queried, and nothing outside it</text>

      <!-- ================================ THE COMPOSITION ================================ -->
      <rect x="308" y="208" width="384" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="308" y="208" width="384" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="316" y="218" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="348" y="227" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMPOSE</text>
      <text x="500" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">queryAvailability</text>
      <text x="500" y="272" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">candidateResources MINUS busyResources</text>
      <text x="500" y="288" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">src/application — the only place the two meet</text>

      <!-- ================================== THE ANSWER ================================== -->
      <rect x="308" y="352" width="384" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="308" y="352" width="384" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="316" y="362" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="342" y="371" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200</text>
      <text x="500" y="398" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">free (bay, technician) pairs</text>
      <text x="500" y="416" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">may be stale before the response is serialised</text>
      <text x="500" y="430" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">staleness is a property of the interface, not a defect</text>

      <!-- ========================== ONE EXPRESSION, WRITTEN TWICE ========================== -->
      <rect x="64" y="488" width="872" height="104" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="488" width="872" height="104" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="72" y="498" width="132" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="138" y="507" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ONE EXPRESSION, TWICE</text>
      <text x="80" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">busyResources    tstzrange(starts_at, ends_at) &amp;&amp; tstzrange($from, $to) AND status &lt;&gt; 'cancelled'</text>
      <text x="80" y="554" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">no_bay_overlap   EXCLUDE USING gist (bay_id WITH =, tstzrange(starts_at, ends_at) WITH &amp;&amp;) WHERE status &lt;&gt; 'cancelled'</text>
      <text x="80" y="578" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace">two files, and nothing structural holds them equal — QS-8 does (§11.2 R-5)</text>

      <!-- ============================== EDITORIAL ASIDE ============================== -->
      <text x="64" y="632" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">A good answer to "what is free?", and never the reason a write is allowed.</text>

      <!-- ================================== LEGEND ================================== -->
      <line x1="64" y1="664" x2="936" y2="664" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="64" y="684" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="140" y1="680" x2="172" y2="680" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="180" y="684" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Read</text>

      <rect x="248" y="672" width="32" height="16" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="288" y="684" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Repository — one source only</text>

      <rect x="500" y="672" width="32" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="540" y="684" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Application</text>

      <line x1="660" y1="680" x2="692" y2="680" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="700" y="684" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Advisory — nothing is reserved</text>
    </svg>
