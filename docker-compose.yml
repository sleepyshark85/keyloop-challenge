# Local stack — PostgreSQL and the observability collector. The SERVICE IS NOT HERE.
#
# Ruled by the human at slice 00a step 2 (docs/slices/00a-design.md §11.1): compose starts
# `postgres` and `otel-lgtm` only, and the service runs on the host with `npm start`.
# Containerising it would cost a Dockerfile, a build stage and an image-caching story
# maintained across twelve slices, for no demo benefit — recorded as a deferred improvement
# in §11.5 rather than as an omission.
#
# NOTHING HERE IS ON THE TEST PATH. `npm test` starts its own throwaway postgres:16 through
# Testcontainers (arc42 §7.2), so a suite run neither needs this file nor is affected by it.
# It exists for `npm start`, for slice 10's cURL harness, and for looking at traces.
#
#   docker compose up -d
#   DATABASE_URL=postgresql://keyloop:keyloop@127.0.0.1:5432/keyloop PORT=3000 npm start
#   curl -i localhost:3000/health
#
# The credentials are fixed and public on purpose: there is nothing to authenticate to
# (ADR-0002), and this database holds nothing that is not regenerated by a migration.

services:
  postgres:
    image: postgres:16
    # Pinned to the major version Testcontainers starts. A local database on a different
    # major than the one the exclusion constraints are proved against is a way to discover
    # a behavioural difference at the least convenient moment.
    environment:
      POSTGRES_USER: keyloop
      POSTGRES_PASSWORD: keyloop
      POSTGRES_DB: keyloop
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keyloop -d keyloop']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  otel-lgtm:
    # Grafana's all-in-one: OTLP collector, Prometheus, Loki, Tempo and Grafana in one
    # image (ADR-0010). Slice 09 wires the SDK to it; in 00a it is here so that the
    # deployment view and the compose file do not disagree.
    image: grafana/otel-lgtm:latest
    ports:
      - '3001:3000' # Grafana UI — 3000 is left free for the service on the host
      - '4317:4317' # OTLP/gRPC
      - '4318:4318' # OTLP/HTTP

volumes:
  postgres-data:
